services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kino_db
      MYSQL_USER: jens
      MYSQL_PASSWORD: ${DB_PASSWORD:-x}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-x}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/kino_db
      DATABASE_USERNAME: jens
      DATABASE_PASSWORD: ${DB_PASSWORD:-x}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../kino_frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  mysqldata: